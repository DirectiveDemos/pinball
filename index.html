<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Pinball</title>
    <link rel="icon" href="assets/icon-key-YfThh_Bm.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #140e09;
        color: #f3e6cf;
        font: 16px/1.4 "Segoe UI", sans-serif;
        position: fixed;
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #app {
        --journal-over: 44px;
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 480px);
        overflow: hidden;
      }
      #stage {
        min-width: 0;
        min-height: 0;
        height: 100%;
        position: relative;
        display: grid;
      }
      canvas {
        display: block;
        background: #1c140e;
      }
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 4;
        margin: 0;
        max-height: 40%;
        overflow: auto;
        pointer-events: none;
        white-space: pre;
        font-size: 12px;
        padding: 4px 8px;
      }
      #journal {
        position: relative;
        min-height: 0;
        height: 100%;
        background: #1a120c;
      }
      /*
        The table-plus-journal pair is narrower than a 1080p window. Center it.
        The hall uses a 1fr stage column, so this does not shrink that stage.
      */
      #app[data-journal="side"] {
        justify-content: center;
      }
      /*
        Phone, and any window too narrow for a journal column: a one-line score
        strip across the top. A tall panel on the bottom covered the flippers.
      */
      #app[data-journal="over"] {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-areas: "strip" "stage";
      }
      #app[data-journal="over"] #stage {
        grid-area: stage;
        height: auto;
        min-height: 0;
      }
      #app[data-journal="over"] #journal {
        grid-area: strip;
        position: relative;
        left: auto;
        right: auto;
        bottom: auto;
        height: calc(var(--journal-over) + env(safe-area-inset-top));
        padding: env(safe-area-inset-top) 8px 0;
        box-sizing: border-box;
        z-index: 4;
        display: flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
      }
      #app[data-journal="over"] #journal-frame,
      #app[data-journal="over"] #journal-title,
      #app[data-journal="over"] #journal-scene,
      #app[data-journal="over"] #journal-items {
        display: none;
      }
      #app[data-journal="over"] #journal-body {
        position: static;
        inset: auto;
        flex: 1;
        min-width: 0;
        flex-direction: row;
        align-items: center;
        overflow: hidden;
        gap: 8px;
      }
      #app[data-journal="over"] #journal-lines {
        font-size: 13px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #app[data-journal="over"] #journal-audio {
        display: flex;
        flex: none;
        gap: 0;
      }
      #app[data-journal="over"] #journal-audio > :not(#music-mute) {
        display: none;
      }
      #app[data-journal="over"] #music-mute {
        padding: 2px 8px;
        font-size: 12px;
        min-height: 32px;
      }
      #app[data-journal="over"] #play {
        place-items: start center;
      }
      #journal-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
        z-index: 2;
      }
      #journal-title {
        position: absolute;
        top: 3.4%;
        left: 22%;
        right: 22%;
        height: 7.2%;
        margin: 0;
        z-index: 3;
        display: grid;
        place-items: center;
        text-align: center;
        font-size: clamp(14px, 1.6vh, 22px);
        letter-spacing: 0.04em;
      }
      #journal-body {
        position: absolute;
        inset: 13% 16% 14% 16%;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow: auto;
      }
      #journal-lines {
        margin: 0;
        white-space: pre-wrap;
        font: 15px/1.35 "Segoe UI", sans-serif;
      }
      #journal-scene {
        margin: 0;
        font-size: 12px;
        color: #c4a574;
      }
      #journal-items {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #journal-items figure {
        margin: 0;
        width: 72px;
        text-align: center;
        font-size: 11px;
        color: #e8d6b0;
      }
      #journal-items img {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }
      #journal-audio {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      button {
        font: inherit;
        color: #f3e6cf;
        background: #2a2118;
        border: 1px solid #c4a574;
        padding: 4px 8px;
      }
      button:focus-visible {
        outline: 2px solid #f3e6cf;
        outline-offset: 2px;
      }
      #play {
        position: relative;
        min-width: 0;
        min-height: 0;
        height: 100%;
        display: grid;
        place-items: center;
        box-sizing: border-box;
      }
      #table-wrap {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #legend {
        position: absolute;
        z-index: 5;
        left: 50%;
        transform: translateX(-50%);
        box-sizing: border-box;
        max-width: calc(100% - 12px);
        color: #f3e6cf;
        background: rgba(12, 8, 5, 0.88);
        border: 1px solid #c4a574;
        user-select: none;
        -webkit-user-select: none;
      }
      #legend[hidden] {
        display: none;
      }
      #legend[data-mode="hall"] {
        bottom: 2.5%;
        width: min(980px, 96%);
        max-height: 62%;
        overflow: auto;
        padding: 14px 18px 16px;
      }
      #legend[data-mode="play"] {
        top: 8px;
        width: min(1040px, calc(100% - 16px));
        max-height: 28%;
        overflow: auto;
        padding: 6px 8px 8px;
        /* placePlayLegend pins this off the table. Only Hide takes the click, so a finger on the table still flips. */
        pointer-events: none;
      }
      #legend[data-mode="play"] #legend-hide {
        pointer-events: auto;
      }
      #legend-head {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 8px;
      }
      #legend[data-mode="play"] #legend-head {
        position: absolute;
        top: 4px;
        right: 6px;
        margin: 0;
      }
      #legend-heading {
        margin: 0;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #f0d48a;
        font-size: clamp(16px, 2.2vh, 26px);
      }
      #legend[data-mode="play"] #legend-heading {
        display: none;
      }
      #legend-hide,
      #legend-show {
        min-height: 36px;
      }
      #legend-show {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 5;
      }
      #legend-show[hidden] {
        display: none;
      }
      #legend-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px 16px;
      }
      #legend[data-mode="hall"] #legend-list li {
        flex: 0 1 auto;
        min-width: 88px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        text-align: center;
      }
      #legend[data-mode="play"] #legend-list {
        gap: 4px 12px;
        justify-content: flex-start;
        padding-right: 92px;
      }
      #legend[data-mode="play"] #legend-list li {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 4px;
      }
      .legend-chips {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        gap: 4px;
        max-width: 100%;
      }
      #legend kbd {
        font: inherit;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.6em;
        white-space: nowrap;
        padding: 0.2em 0.45em;
        border: 1px solid #e2c48a;
        border-radius: 6px;
        background: #2a2118;
        box-shadow: 0 2px 0 #6b4a28;
        line-height: 1.1;
        font-size: clamp(20px, 3vh, 36px);
      }
      #legend[data-mode="play"] kbd {
        font-size: clamp(14px, 1.8vh, 18px);
        padding: 0.12em 0.35em;
        box-shadow: none;
      }
      .legend-action {
        font-size: clamp(15px, 1.9vh, 22px);
        font-weight: 600;
      }
      #legend[data-mode="play"] .legend-action {
        font-size: clamp(13px, 1.6vh, 16px);
        font-weight: 600;
      }
      .legend-hint {
        font-size: clamp(12px, 1.4vh, 15px);
        color: #c4a574;
      }
      #legend[data-mode="play"] .legend-hint {
        display: none;
      }
      /* Fingers on the table must not scroll or zoom the page. */
      #play,
      canvas,
      #touch,
      #touch button {
        touch-action: none;
      }
      #touch {
        display: none;
      }
      /*
        Phone, and any coarse pointer: on-screen controls. A fine pointer at
        desktop size keeps the keyboard layout with no touch bar.
      */
      @media (pointer: coarse), (max-width: 900px), (max-height: 520px) {
        html,
        body {
          position: fixed;
          inset: 0;
          overflow: hidden;
          overscroll-behavior: none;
          touch-action: none;
        }
        #journal-body {
          touch-action: pan-y;
          overscroll-behavior: contain;
        }
        /* Top-align the table so the leftover band is the touch row, not a cover. */
        #play {
          place-items: start center;
        }
        #touch {
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          position: absolute;
          inset: 0;
          z-index: 5;
          box-sizing: border-box;
          padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
          gap: 8px;
          pointer-events: none;
        }
        #touch .touch-panel,
        #touch button {
          pointer-events: auto;
        }
        #touch .touch-panel {
          box-sizing: border-box;
        }
        #touch .touch-panel[hidden] {
          display: none;
        }
        #touch button {
          font-size: 16px;
          min-height: 48px;
          user-select: none;
          -webkit-user-select: none;
          -webkit-touch-callout: none;
        }
        #touch button:active {
          background: #6b4a28;
        }
        #touch-hall,
        #touch-play {
          display: grid;
          flex: 0 0 auto;
          gap: 8px;
        }
        #touch-hall {
          grid-template-columns: 1fr 1fr;
        }
        #touch-play {
          grid-template-columns: 1.2fr 0.9fr 1.2fr;
        }
        #touch-play button {
          min-height: 64px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          line-height: 1.1;
        }
        #touch-play button span {
          font-size: 12px;
          color: #c4a574;
        }
        #touch-initials {
          position: absolute;
          inset: 8px 8px calc(8px + env(safe-area-inset-bottom));
          display: flex;
          flex-direction: column;
          gap: 8px;
          padding: 8px;
          background: rgba(20, 14, 9, 0.94);
          border: 1px solid #c4a574;
        }
        #touch-draft {
          margin: 0;
          text-align: center;
          font-size: 28px;
          letter-spacing: 0.4em;
        }
        #touch-letters {
          flex: 1;
          display: grid;
          grid-template-columns: repeat(7, minmax(0, 1fr));
          gap: 4px;
        }
        #touch-letters button {
          min-height: 0;
          padding: 0;
        }
        #touch-initials .touch-row {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 8px;
        }
      }
      @media (max-width: 900px), (max-height: 520px) {
        #hud {
          max-height: 3rem;
        }
        #journal-body {
          gap: 4px;
          overflow: auto;
        }
        #journal-lines {
          font-size: 13px;
        }
      }
      /* Short landscape: the flipper row is shorter so the table keeps the height. */
      @media (max-height: 520px) and (min-width: 600px) {
        #touch-play button {
          min-height: 52px;
        }
      }
      @media (pointer: coarse), (max-width: 900px), (max-height: 520px) {
        #legend {
          left: 4px;
          right: 4px;
          width: auto;
          transform: none;
        }
        #legend[data-mode="hall"] {
          /* The table fills the phone. A bottom legend covered the drain, and a top one covered the title. This band sits between them. */
          top: 27%;
          bottom: auto;
          width: auto;
          padding: 6px 8px 8px;
          max-height: 48%;
        }
        #legend[data-mode="hall"] #legend-list,
        #legend[data-mode="play"] #legend-list {
          display: grid;
          grid-template-columns: 1fr 1fr;
          width: 100%;
          min-width: 0;
          gap: 6px 8px;
          padding-right: 0;
        }
        #legend[data-mode="hall"] #legend-list li,
        #legend[data-mode="play"] #legend-list li {
          min-width: 0;
          max-width: 100%;
          flex-wrap: wrap;
          justify-content: center;
        }
        #legend[data-mode="hall"] .legend-chips,
        #legend[data-mode="play"] .legend-chips {
          flex-wrap: wrap;
        }
        #legend[data-mode="hall"] kbd {
          font-size: 16px;
          padding: 0.1em 0.28em;
        }
        #legend[data-mode="hall"] .legend-action {
          font-size: 13px;
        }
        #legend[data-mode="hall"] #legend-list {
          gap: 4px 6px;
        }
        #legend[data-mode="play"] kbd {
          font-size: 15px;
          padding: 0.12em 0.28em;
        }
        #legend[data-mode="play"] {
          top: 4px;
          max-height: 46%;
        }
        #legend[data-mode="play"] #legend-head {
          position: static;
          justify-content: flex-end;
          margin-bottom: 4px;
        }
        #legend-hide,
        #legend-show {
          min-height: 44px;
          touch-action: manipulation;
        }
        .legend-hint {
          display: none;
        }
      }
      /* Side gutter: one column, so Hide sits above the keys instead of over them. */
      #legend[data-place="gutter"] #legend-list {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding-right: 0;
      }
      #legend[data-place="gutter"] #legend-head {
        position: static;
        justify-content: flex-end;
        margin-bottom: 4px;
      }
    </style>

          <div id="journal-items"></div>
          <p id="journal-scene"></p>
          <div id="journal-audio">

            <span id="music-volume">Music 60%</span>
            <button type="button" id="music-down">Music down</button>
            <button type="button" id="music-up">Music up</button>
            <span id="sfx-volume">SFX 80%</span>
            <button type="button" id="sfx-down">SFX down</button>
            <button type="button" id="sfx-up">SFX up</button>
          </div>
        </div>
      </aside>
    </div>
  </body>
