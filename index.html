<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Pinball</title>
    <link rel="icon" href="assets/icon-key-YfThh_Bm.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #140e09;
        color: #f3e6cf;
        font: 16px/1.4 "Segoe UI", sans-serif;
        position: fixed;
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #app {
        --journal-over: 44px;
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 480px);
        overflow: hidden;
      }
      #stage {
        min-width: 0;
        min-height: 0;
        height: 100%;
        position: relative;
        display: grid;
      }
      canvas {
        display: block;
        background: #1c140e;
      }
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 4;
        margin: 0;
        max-height: 40%;
        overflow: auto;
        pointer-events: none;
        white-space: pre;
        font-size: 12px;
        padding: 4px 8px;
      }
      #journal {
        position: relative;
        min-height: 0;
        height: 100%;
        background: #1a120c;
      }
      /*
        The table-plus-journal pair is narrower than a 1080p window. Center it.
        The hall uses a 1fr stage column, so this does not shrink that stage.
      */
      #app[data-journal="side"] {
        justify-content: center;
      }
      /*
        Phone, and any window too narrow for a journal column: a one-line score
        strip across the top. A tall panel on the bottom covered the flippers.
      */
      #app[data-journal="over"] {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-areas: "strip" "stage";
      }
      #app[data-journal="over"] #stage {
        grid-area: stage;
        height: auto;
        min-height: 0;
      }
      #app[data-journal="over"] #journal {
        grid-area: strip;
        position: relative;
        left: auto;
        right: auto;
        bottom: auto;
        height: calc(var(--journal-over) + env(safe-area-inset-top));
        padding: env(safe-area-inset-top) 8px 0;
        box-sizing: border-box;
        z-index: 4;
        display: flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
      }
      #app[data-journal="over"] #journal-frame,
      #app[data-journal="over"] #journal-title,
      #app[data-journal="over"] #journal-scene,
      #app[data-journal="over"] #journal-items {
        display: none;
      }
      #app[data-journal="over"] #journal-body {
        position: static;
        inset: auto;
        flex: 1;
        min-width: 0;
        flex-direction: row;
        align-items: center;
        overflow: hidden;
        gap: 8px;
      }
      #app[data-journal="over"] #journal-lines {
        font-size: 13px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #app[data-journal="over"] #journal-audio {
        display: flex;
        flex: none;
        gap: 0;
      }
      #app[data-journal="over"] #journal-audio > :not(#music-mute):not(#scores-toggle) {
        display: none;
      }
      #app[data-journal="over"] #music-mute,
      #app[data-journal="over"] #scores-toggle {
        padding: 2px 8px;
        font-size: 12px;
        min-height: 32px;
      }
      /*
        Open high scores grow the phone strip. The stage grid row is the table,
        so the list stays above the playfield (DRA-3958).
      */
      #app[data-scores="open"][data-journal="over"] #journal {
        /* A definite cap, not height:auto, so a long hall scrolls inside the strip. */
        height: min(var(--scores-max, 280px), 46vh);
        max-height: min(var(--scores-max, 280px), 46vh);
        align-items: stretch;
      }
      #app[data-scores="open"][data-journal="over"] #journal-body {
        flex: 1 1 auto;
        min-height: 0;
        flex-direction: column;
        align-items: stretch;
        overflow: hidden;
      }
      #app[data-scores="open"][data-journal="over"] #journal-lines,
      #app[data-scores="open"][data-journal="over"] #journal-audio {
        flex: none;
      }
      #app[data-scores="open"][data-journal="over"] #journal-audio {
        order: -1;
        /*
          Controls is pinned to the left of this row (fit.ts scoresToggleRect).
          120px is LEGEND_SHOW_STRIP_W_PX + LEGEND_PAD_PX, and the strip's
          left padding is that same pad, so Close and Mute start clear of it.
          main.ts sets the live width once the legend has been measured.
        */
        margin-left: var(--scores-toggle-inset, 120px);
      }
      #app[data-scores="open"][data-journal="over"] #scores {
        flex: 1 1 auto;
        min-height: 0;
        max-height: none;
        overflow: hidden;
      }
      #app[data-scores="open"][data-journal="over"] #scores-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
      }
      #app[data-scores="open"][data-journal="over"] #scores-toggle,
      #app[data-scores="open"][data-journal="over"] #scores-close {
        min-height: 44px;
      }
      #app[data-journal="over"] #play {
        place-items: start center;
      }
      #journal-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
        z-index: 2;
      }
      #journal-title {
        position: absolute;
        top: 3.4%;
        left: 22%;
        right: 22%;
        height: 7.2%;
        margin: 0;
        z-index: 3;
        display: grid;
        place-items: center;
        text-align: center;
        font-size: clamp(14px, 1.6vh, 22px);
        letter-spacing: 0.04em;
      }
      #journal-body {
        position: absolute;
        inset: 13% 16% 14% 16%;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow: auto;
      }
      #journal-lines {
        margin: 0;
        white-space: pre-wrap;
        font: 15px/1.35 "Segoe UI", sans-serif;
      }
      #journal-scene {
        margin: 0;
        font-size: 12px;
        color: #c4a574;
      }
      #journal-items {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #journal-items figure {
        margin: 0;
        width: 72px;
        text-align: center;
        font-size: 11px;
        color: #e8d6b0;
      }
      #journal-items img {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }
      #journal-audio {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      #scores[hidden] {
        display: none;
      }
      #scores {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-height: 0;
        max-height: 42%;
        overflow: auto;
        touch-action: pan-y;
      }
      #scores-title {
        margin: 0;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f0d48a;
        font-size: 14px;
      }
      #scores-list {
        margin: 0;
        padding: 0;
        list-style: none;
        font-variant-numeric: tabular-nums;
      }
      #scores-list li {
        padding: 2px 0;
      }
      #scores-close {
        align-self: flex-start;
        min-height: 36px;
      }
      /*
        Side journal: the play log was shrinking the list to one row (DRA-3958).
        The floor is a title, about five entries, and Close. It scrolls after that.
      */
      #app[data-journal="side"] #scores {
        flex: 0 0 auto;
        min-height: 12.5rem;
        max-height: max(12.5rem, 42%);
      }
      /*
        Opening the list on a short desktop column pushes Close below the frame.
        Keep the button row on top of the text well. A pinned landscape button
        already sits there, so this stays off while data-scores-pin is set.
      */
      #app[data-journal="side"][data-scores="open"]:not([data-scores-pin="top"]) #journal-audio {
        order: -1;
        position: sticky;
        top: 0;
        z-index: 3;
        background: #1a120c;
        padding-bottom: 4px;
      }
      /* Short landscape: Scores is fixed to the top of the journal, so the log starts below it. */
      #app[data-scores-pin="top"] #journal-body {
        padding-top: 52px;
      }
      #app[data-scores-pin="top"] #scores-toggle {
        touch-action: manipulation;
        white-space: nowrap;
      }
      button {
        font: inherit;
        color: #f3e6cf;
        background: #2a2118;
        border: 1px solid #c4a574;
        padding: 4px 8px;
      }
      button:focus-visible {
        outline: 2px solid #f3e6cf;
        outline-offset: 2px;
      }
      #play {
        position: relative;
        min-width: 0;
        min-height: 0;
        height: 100%;
        display: grid;
        place-items: center;
        box-sizing: border-box;
      }
      #table-wrap {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #legend {
        position: absolute;
        z-index: 5;
        left: 50%;
        transform: translateX(-50%);
        box-sizing: border-box;
        max-width: calc(100% - 12px);
        color: #f3e6cf;
        background: rgba(12, 8, 5, 0.88);
        border: 1px solid #c4a574;
        user-select: none;
        -webkit-user-select: none;
      }
      #legend[hidden] {
        display: none;
      }
      #legend[data-mode="hall"] {
        bottom: 2.5%;
        width: min(980px, 96%);
        max-height: 62%;
        overflow: auto;
        padding: 14px 18px 16px;
      }
      #legend[data-mode="play"] {
        top: 8px;
        width: min(1040px, calc(100% - 16px));
        max-height: 28%;
        overflow: auto;
        padding: 6px 8px 8px;
        /* placePlayLegend pins this off the table. Only Hide takes the click, so a finger on the table still flips. */
        pointer-events: none;
      }
      #legend[data-mode="play"] #legend-hide {
        pointer-events: auto;
      }
      #legend-head {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 8px;
      }
      #legend[data-mode="play"] #legend-head {
        position: absolute;
        top: 4px;
        right: 6px;
        margin: 0;
      }
      #legend-heading {
        margin: 0;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #f0d48a;
        font-size: clamp(16px, 2.2vh, 26px);
      }
      #legend[data-mode="play"] #legend-heading {
        display: none;
      }
      #legend-hide,
      #legend-show {
        min-height: 36px;
      }
      #legend-show {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 5;
      }
      #legend-show[hidden] {
        display: none;
      }
      #legend-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px 16px;
      }
      #legend[data-mode="hall"] #legend-list li {
        flex: 0 1 auto;
        min-width: 88px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        text-align: center;
      }
      #legend[data-mode="play"] #legend-list {
        gap: 4px 12px;
        justify-content: flex-start;
        padding-right: 92px;
      }
      #legend[data-mode="play"] #legend-list li {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 4px;
      }
      .legend-chips {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        gap: 4px;
        max-width: 100%;
      }
      #legend kbd {
        font: inherit;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.6em;
        white-space: nowrap;
        padding: 0.2em 0.45em;
        border: 1px solid #e2c48a;
        border-radius: 6px;
        background: #2a2118;
        box-shadow: 0 2px 0 #6b4a28;
        line-height: 1.1;
        font-size: clamp(20px, 3vh, 36px);
      }
      #legend[data-mode="play"] kbd {
        font-size: clamp(14px, 1.8vh, 18px);
        padding: 0.12em 0.35em;
        box-shadow: none;
      }
      .legend-action {
        font-size: clamp(15px, 1.9vh, 22px);
        font-weight: 600;
      }
      #legend[data-mode="play"] .legend-action {
        font-size: clamp(13px, 1.6vh, 16px);
        font-weight: 600;
      }
      .legend-hint {
        font-size: clamp(12px, 1.4vh, 15px);
        color: #c4a574;
      }
      #legend[data-mode="play"] .legend-hint {
        display: none;
      }
      /* Fingers on the table must not scroll or zoom the page. */
      #play,
      canvas,
      #touch,
      #touch button {
        touch-action: none;
      }
      #touch {
        display: none;
      }
      /*
        Phone, and any coarse pointer: on-screen controls. A fine pointer at
        desktop size keeps the keyboard layout with no touch bar.
      */
      @media (pointer: coarse), (max-width: 900px), (max-height: 520px) {
        html,
        body {
          position: fixed;
          inset: 0;
          overflow: hidden;
          overscroll-behavior: none;
          touch-action: none;
        }
        #journal-body {
          touch-action: pan-y;
          overscroll-behavior: contain;
        }
        /* Top-align the table so the leftover band is the touch row, not a cover. */
        #play {
          place-items: start center;
        }
        #touch {
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          position: absolute;
          inset: 0;
          z-index: 5;
          box-sizing: border-box;
          padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
          gap: 8px;
          pointer-events: none;
        }
        #touch .touch-panel,
        #touch button {
          pointer-events: auto;
        }
        #touch .touch-panel {
          box-sizing: border-box;
        }
        #touch .touch-panel[hidden] {
          display: none;
        }
        #touch button {
          font-size: 16px;
          min-height: 48px;
          user-select: none;
          -webkit-user-select: none;
          -webkit-touch-callout: none;
        }
        #touch button:active {
          background: #6b4a28;
        }
        #touch-hall,
        #touch-play {
          display: grid;
          flex: 0 0 auto;
          gap: 8px;
        }
        #touch-hall {
          grid-template-columns: 1fr 1fr;
        }
        #touch-scores {
          grid-column: 1 / -1;
        }
        #touch-play {
          grid-template-columns: 1.2fr 0.9fr 1.2fr;
        }
        #touch-play button {
          min-height: 64px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          line-height: 1.1;
        }
        #touch-play button span {
          font-size: 12px;
          color: #c4a574;
        }
        #touch-initials {
          position: absolute;
          inset: 8px 8px calc(8px + env(safe-area-inset-bottom));
          display: flex;
          flex-direction: column;
          gap: 8px;
          padding: 8px;
          background: rgba(20, 14, 9, 0.94);
          border: 1px solid #c4a574;
        }
        #touch-draft {
          margin: 0;
          text-align: center;
          font-size: 28px;
          letter-spacing: 0.4em;
        }
        #touch-letters {
          flex: 1;
          display: grid;
          grid-template-columns: repeat(7, minmax(0, 1fr));
          gap: 4px;
        }
        #touch-letters button {
          min-height: 0;
          padding: 0;
        }
        #touch-initials .touch-row {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 8px;
        }
      }
      @media (max-width: 900px), (max-height: 520px) {
        #hud {
          max-height: 3rem;
        }
        #journal-body {
          gap: 4px;
          overflow: auto;
        }
        #journal-lines {
          font-size: 13px;
        }
      }
      /* Short landscape: the flipper row is shorter so the table keeps the height. */
      @media (max-height: 520px) and (min-width: 600px) {
        #touch-play button {
          min-height: 52px;
        }
      }
      @media (pointer: coarse), (max-width: 900px), (max-height: 520px) {
        #legend {
          left: 4px;
          right: 4px;
          width: auto;
          transform: none;
        }
        #legend[data-mode="hall"] {
          /* The table fills the phone. A bottom legend covered the drain, and a top one covered the title. This band sits between them. */
          top: 27%;
          bottom: auto;
          width: auto;
          padding: 6px 8px 8px;
          max-height: 48%;
        }
        #legend[data-mode="hall"] #legend-list,
        #legend[data-mode="play"] #legend-list {
          display: grid;
          grid-template-columns: 1fr 1fr;
          width: 100%;
          min-width: 0;
          gap: 6px 8px;
          padding-right: 0;
        }
        #legend[data-mode="hall"] #legend-list li,
        #legend[data-mode="play"] #legend-list li {
          min-width: 0;
          max-width: 100%;
          flex-wrap: wrap;
          justify-content: center;
        }
        #legend[data-mode="hall"] .legend-chips,
        #legend[data-mode="play"] .legend-chips {
          flex-wrap: wrap;
        }
        #legend[data-mode="hall"] kbd {
          font-size: 16px;
          padding: 0.1em 0.28em;
        }
        #legend[data-mode="hall"] .legend-action {
          font-size: 13px;
        }
        #legend[data-mode="hall"] #legend-list {
          gap: 4px 6px;
        }
        #legend[data-mode="play"] kbd {
          font-size: 15px;
          padding: 0.12em 0.28em;
        }
        #legend[data-mode="play"] {
          top: 4px;
          max-height: 46%;
        }
        #legend[data-mode="play"] #legend-head {
          position: static;
          justify-content: flex-end;
          margin-bottom: 4px;
        }
        #legend-hide,
        #legend-show {
          min-height: 44px;
          touch-action: manipulation;
        }
        .legend-hint {
          display: none;
        }
      }
      /* Side gutter: one column, so Hide sits above the keys instead of over them. */
      #legend[data-place="gutter"] #legend-list {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding-right: 0;
      }
      #legend[data-place="gutter"] #legend-head {
        position: static;
        justify-content: flex-end;
        margin-bottom: 4px;
      }

      /* Reserved table header: outside the collision/playfield rectangle. */
      #app[data-playing="true"] #stage { padding-top: var(--hud-height, 154px); box-sizing: border-box; }
      #play-hud[hidden] { display: none; }
      #play-hud {
        --quest-rgb: 225, 194, 137;
        position: absolute; inset: 0 0 auto; min-height: 154px; box-sizing: border-box;
        padding: 8px 14px; z-index: 2; pointer-events: none;
        background: linear-gradient(120deg, #211b15, #0d151a);
        border: 1px solid #796143; border-bottom: 2px solid rgb(var(--quest-rgb));
        color: #fff4df; font-variant-numeric: tabular-nums;
      }
      .hud-totals { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      [data-hud="score"] { font-size: var(--score-size, 44px); font-weight: 750; line-height: 1.1; letter-spacing: -1px; }
      .hud-level { text-align: right; color: #efcc88; font-size: 16px; font-weight: 650; }
      [data-hud="multiplier"] { display: block; color: #fff4df; font-size: 15px; }
      .hud-quest { border-left: 3px solid rgb(var(--quest-rgb)); padding-left: 9px; margin-top: 6px; }
      [data-hud="kind"] { color: rgb(var(--quest-rgb)); text-transform: uppercase; font-size: 11px; letter-spacing: 1px; font-weight: 750; }
      [data-hud="name"] { font-size: 17px; font-weight: 650; line-height: 1.2; }
      [data-hud="progress"] { font-size: 14px; line-height: 1.3; }
      #play-hud progress { display: block; width: 100%; height: 4px; margin-top: 4px; accent-color: rgb(var(--quest-rgb)); }
      #play-hud progress::-webkit-progress-value { background: rgb(var(--quest-rgb)); }
      #play-hud progress::-webkit-progress-bar { background: #465052; }
      [data-hud="callout"] { min-height: 16px; font-size: 12px; color: #ffe6a5; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #play-hud[data-boss="true"] [data-hud="kind"] { color: #fff; background: #8d2922; padding: 1px 6px; }
      @media (max-width: 600px) {
        #app[data-playing="true"] #stage { padding-top: var(--hud-height, 144px); }
        #play-hud { min-height: 144px; padding: 7px 10px; }
        [data-hud="score"] { font-size: min(var(--score-size, 38px), 8.2vw); }
        .hud-level { font-size: 14px; }
        [data-hud="multiplier"] { font-size: 13px; }
        [data-hud="name"] { font-size: 16px; }
        [data-hud="progress"] { font-size: 13px; }
      }

  <body>
    <div id="app">
      <div id="stage">
        <section id="play-hud" aria-label="Live score and quest" hidden>
          <div class="hud-totals">
            <div data-hud="score" aria-label="Score">0</div>
            <div class="hud-level"><div data-hud="level"></div><span data-hud="multiplier"></span></div>
          </div>
          <div class="hud-quest"><span data-hud="kind"></span><div data-hud="name"></div>
            <div data-hud="progress"></div><progress max="1" value="0" aria-label="Quest stage progress"></progress>
          </div>
          <div data-hud="callout" role="status"></div>
        </section>
        <div id="play">
          <div id="table-wrap">
            <canvas id="table" width="520" height="1040"></canvas>
            <div id="legend" data-mode="hall">
              <div id="legend-head">
                <p id="legend-heading">Controls</p>
                <button type="button" id="legend-hide" hidden>Hide</button>
              </div>
              <ul id="legend-list"></ul>
            </div>
            <button type="button" id="legend-show" hidden>Controls</button>
          </div>
          <div id="touch">
            <div id="touch-hall" class="touch-panel">
              <button type="button" data-players="1">1 player</button>
              <button type="button" data-players="2">2 players</button>
              <button type="button" data-players="3">3 players</button>
              <button type="button" data-players="4">4 players</button>
              <button type="button" id="touch-scores" aria-controls="scores" aria-expanded="false">High scores</button>
            </div>
            <div id="touch-initials" class="touch-panel" hidden>
              <p id="touch-draft">___</p>
              <div id="touch-letters"></div>
              <div class="touch-row">
                <button type="button" id="touch-back">Delete</button>
                <button type="button" id="touch-ok">OK</button>
              </div>
            </div>
            <div id="touch-play" class="touch-panel" hidden>
              <button type="button" id="touch-left">Left<span>flipper</span></button>
              <button type="button" id="touch-launch">Launch<span>hold</span></button>
              <button type="button" id="touch-right">Right<span>flipper</span></button>
            </div>
          </div>
        </div>
        <p id="hud"></p>
      </div>
      <aside id="journal">
        <h1 id="journal-title">Adventurer's Journal</h1>
        <img id="journal-frame" alt="" />
        <div id="journal-body">
          <div id="scores" hidden>
            <p id="scores-title">High scores</p>
            <ol id="scores-list"></ol>
            <button type="button" id="scores-close">Close</button>
          </div>
          <pre id="journal-lines"></pre>
          <div id="journal-items"></div>
          <p id="journal-scene"></p>
          <div id="journal-audio">
            <button type="button" id="scores-toggle" aria-controls="scores" aria-expanded="false">High scores (H)</button>
            <button type="button" id="music-mute">Mute music</button>
            <span id="music-volume">Music 60%</span>
            <button type="button" id="music-down">Music down</button>
            <button type="button" id="music-up">Music up</button>
            <span id="sfx-volume">SFX 80%</span>
            <button type="button" id="sfx-down">SFX down</button>
            <button type="button" id="sfx-up">SFX up</button>
          </div>
        </div>
      </aside>
    </div>
  </body>
</html>
