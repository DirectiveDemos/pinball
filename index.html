        margin: 0;

      #legend-heading {

      #legend-show[hidden] {

      #legend-list {
        list-style: none;

        flex-wrap: wrap;
        justify-content: center;
        gap: 12px 16px;

      #legend[data-mode="hall"] #legend-list li {
        flex: 0 1 auto;

        flex-direction: column;

        gap: 4px;

      }
      #legend[data-mode="play"] #legend-list {

      #legend[data-mode="play"] #legend-list li {

      #legend kbd {

      /* Fingers on the table must not scroll or zoom the page. */
      #play,
      canvas,
      #touch,

      #touch {

      /*

      @media (pointer: coarse), (max-width: 900px), (max-height: 520px) {

        #touch-letters button {

        #touch-initials .touch-row {

          grid-template-columns: 1fr 1fr;
          gap: 8px;

      @media (max-width: 900px), (max-height: 520px) {

          max-height: 3rem;
        }
        #journal-body {
          gap: 4px;
          overflow: auto;
        }
        #journal-lines {

      @media (max-height: 520px) and (min-width: 600px) {
        #touch-play button {
          min-height: 52px;
        }
      }
      @media (pointer: coarse), (max-width: 900px), (max-height: 520px) {
        #legend {
          left: 4px;
          right: 4px;
          width: auto;
          transform: none;
        }

          width: auto;

          flex-wrap: wrap;
          justify-content: center;

        #legend[data-mode="hall"] .legend-chips,

          flex-wrap: wrap;
        }
        #legend[data-mode="hall"] kbd {
          font-size: 16px;
          padding: 0.1em 0.28em;
        }

        align-items: flex-start;
        padding-right: 0;
      }
      #legend[data-place="gutter"] #legend-head {
        position: static;
        justify-content: flex-end;
        margin-bottom: 4px;
      }

    <div id="app">
      <div id="stage">
        <div id="play">
          <div id="table-wrap">
            <canvas id="table" width="520" height="1040"></canvas>
            <div id="legend" data-mode="hall">
              <div id="legend-head">
                <p id="legend-heading">Controls</p>
                <button type="button" id="legend-hide" hidden>Hide</button>
              </div>
              <ul id="legend-list"></ul>
            </div>
            <button type="button" id="legend-show" hidden>Controls</button>
          </div>
          <div id="touch">
            <div id="touch-hall" class="touch-panel">
              <button type="button" data-players="1">1 player</button>

              <button type="button" data-players="3">3 players</button>
              <button type="button" data-players="4">4 players</button>
              <button type="button" id="touch-scores" aria-controls="scores" aria-expanded="false">High scores</button>
            </div>
            <div id="touch-initials" class="touch-panel" hidden>
              <p id="touch-draft">___</p>
              <div id="touch-letters"></div>
              <div class="touch-row">

                <button type="button" id="touch-ok">OK</button>
              </div>
            </div>
            <div id="touch-play" class="touch-panel" hidden>
              <button type="button" id="touch-left">Left<span>flipper</span></button>
              <button type="button" id="touch-launch">Launch<span>hold</span></button>
              <button type="button" id="touch-right">Right<span>flipper</span></button>
            </div>
          </div>
        </div>
        <p id="hud"></p>
      </div>

        <img id="journal-frame" alt="" />
        <div id="journal-body">
          <div id="scores" hidden>
            <p id="scores-title">High scores</p>
            <ol id="scores-list"></ol>
            <button type="button" id="scores-close">Close</button>
          </div>
          <pre id="journal-lines"></pre>
          <div id="journal-items"></div>
          <p id="journal-scene"></p>
          <div id="journal-audio">
            <button type="button" id="scores-toggle" aria-controls="scores" aria-expanded="false">High scores (H)</button>
            <button type="button" id="music-mute">Mute music</button>
            <span id="music-volume">Music 60%</span>
            <button type="button" id="music-down">Music down</button>
            <button type="button" id="music-up">Music up</button>
            <span id="sfx-volume">SFX 80%</span>
            <button type="button" id="sfx-down">SFX down</button>
            <button type="button" id="sfx-up">SFX up</button>
          </div>
        </div>
      </aside>
    </div>
  </body>
</html>
