<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinball</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #140e09;
        color: #f3e6cf;
        font: 16px/1.4 "Segoe UI", sans-serif;
      }
      #app {
        height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 480px);
      }
      #stage {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      canvas {
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        background: #1c140e;
      }
      #hud {
        margin: 0;
        max-height: 7rem;
        overflow: hidden;
        white-space: pre;
        font-size: 12px;
        padding: 4px 8px;
      }
      #journal {
        position: relative;
        min-height: 0;
        background: #1a120c;
      }
      #journal-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        pointer-events: none;
        z-index: 2;
      }
      #journal-title {
        position: absolute;
        top: 3.4%;
        left: 22%;
        right: 22%;
        height: 7.2%;
        margin: 0;
        z-index: 3;
        display: grid;
        place-items: center;
        text-align: center;
        font-size: clamp(14px, 1.6vh, 22px);
        letter-spacing: 0.04em;
      }
      #journal-body {
        position: absolute;
        inset: 13% 16% 14% 16%;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow: auto;
      }
      #journal-lines {
        margin: 0;
        white-space: pre-wrap;
        font: 15px/1.35 "Segoe UI", sans-serif;
      }
      #journal-scene {
        margin: 0;
        font-size: 12px;
        color: #c4a574;
      }
      #journal-items {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #journal-items figure {
        margin: 0;
        width: 72px;
        text-align: center;
        font-size: 11px;
        color: #e8d6b0;
      }
      #journal-items img {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }
      #journal-audio {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      button {
        font: inherit;
        color: #f3e6cf;
        background: #2a2118;
        border: 1px solid #c4a574;
        padding: 4px 8px;
      }
      button:focus-visible {
        outline: 2px solid #f3e6cf;
        outline-offset: 2px;
      }
    </style>
